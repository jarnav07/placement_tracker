name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Guards the ownership, ranking-parity and role-quality rules the tracker
      # depends on. See scripts/check-invariants.mjs.
      - run: npm run check
      - run: npm run build
