name: Placement Maintenance

on:
  schedule:
    # GitHub cron is UTC only, so each London time needs both its GMT and its BST
    # hour and a gate job decides which one is real. See the `gate` job below.
    #
    # 07:00 London — scheduled openings only (cheap, no AI provider). A placement
    # whose employer published today as the day applications open is flipped
    # before the working day starts, instead of waiting for the evening pass.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    # 12:00 London — scheduled openings again, for campaigns that go live at noon.
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    # 16:00 London — the full pass: deterministic verification of tracked roles,
    # then openings. Discovery of new roles is paused.
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      steps:
        description: Which steps to run
        type: choice
        default: verify-only
        options: [verify-only, openings-only, providers-only]
      limit:
        description: 'Verify at most N roles (0 = all). Highest-value roles first.'
        type: string
        default: '0'
      only_stale_days:
        description: 'Only verify roles not checked in the last N days (0 = all).'
        type: string
        default: '0'
      include_not_interested:
        description: Also verify roles marked Not Interested
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: placement-maintenance
  # An interrupted verification must not leave the board half-updated.
  cancel-in-progress: false

jobs:
  gate:
    # Each London time fires twice (its GMT hour and its BST hour); only the one
    # that is actually the intended London time should do work, and it decides
    # WHICH work. A manual run is ALWAYS honoured — an earlier version applied the
    # clock gate to workflow_dispatch too, so manual runs silently did nothing
    # unless they happened to start at exactly 4 PM UK.
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.decide.outputs.mode }}
    steps:
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "mode=${{ inputs.steps || 'verify-only' }}" >> "$GITHUB_OUTPUT"
            echo "Manual run — proceeding with '${{ inputs.steps || 'verify-only' }}'."
            exit 0
          fi

          UK_HOUR="$(TZ=Europe/London date +%H)"
          case "$UK_HOUR" in
            # Discovery is paused: the daily pass only re-checks roles already tracked.
            16) MODE=verify-only ;;
            07|12) MODE=openings-only ;;
            *) MODE=none ;;
          esac

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "London time is $(TZ=Europe/London date '+%Y-%m-%d %H:%M %Z') — mode '$MODE'."

  # Proves the verification keys actually work, and nothing else. Cheap enough to
  # run on demand: a few hundred tokens and under a minute. Use it after changing
  # a key, rather than discovering the problem in the middle of a nightly pass.
  providers:
    needs: gate
    if: needs.gate.outputs.mode == 'providers-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      VERTEX_API_KEY: ${{ secrets.VERTEX_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_BACKEND: ${{ vars.GEMINI_BACKEND }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Report which keys are present
        run: |
          echo "VERTEX_API_KEY:               ${VERTEX_API_KEY:+set}${VERTEX_API_KEY:-NOT SET}"
          echo "GEMINI_API_KEY:               ${GEMINI_API_KEY:+set}${GEMINI_API_KEY:-NOT SET}"
          echo "AZURE_OPENAI_API_KEY:         ${AZURE_OPENAI_API_KEY:+set}${AZURE_OPENAI_API_KEY:-NOT SET}"
          echo "AZURE_OPENAI_ENDPOINT:        ${AZURE_OPENAI_ENDPOINT:+set}${AZURE_OPENAI_ENDPOINT:-NOT SET}"
          echo "AZURE_OPENAI_DEPLOYMENT_NAME: ${AZURE_OPENAI_DEPLOYMENT_NAME:+set}${AZURE_OPENAI_DEPLOYMENT_NAME:-NOT SET}"
          echo "GEMINI_BACKEND (variable):    ${GEMINI_BACKEND:-unset}"
          echo "GEMINI_MODEL (variable):      ${GEMINI_MODEL:-unset}"

      - name: Test the verification providers
        run: npm run check:providers

  # Flips placements whose employer published today as the day applications open.
  # Deliberately separate from `maintain`: it needs no AI provider and no crawl,
  # so it can run several times a day for the cost of one database query.
  openings:
    needs: gate
    if: needs.gate.outputs.mode == 'openings-only'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check required secrets
        run: |
          missing=""
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      - name: Apply published opening dates
        run: npm run openings

  maintain:
    needs: gate
    if: needs.gate.outputs.mode == 'verify-only'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      # Verification is deterministic for now: the tracked pages and the employer's
      # applicant tracking system only. Vertex AI / Gemini and Azure are not called,
      # so no AI key is needed. Remove this line to bring the providers back.
      VERIFY_PROVIDERS: deterministic

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check required secrets
        run: |
          missing=""
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      # Discovery of new roles (npm run discover) is paused: only roles already in
      # the tracker are re-checked.

      # Re-checks each tracked role against the deterministic evidence alone. A
      # status changes only when the board or the tracked page is decisive; every
      # other row keeps what it has. Identity, derived ranking and user-owned
      # tracking columns are never written.
      - name: Verify every tracked placement
        env:
          AUDIT_LIMIT: ${{ inputs.limit || '0' }}
          AUDIT_ONLY_STALE_DAYS: ${{ inputs.only_stale_days || '0' }}
          AUDIT_INCLUDE_NOT_INTERESTED: ${{ inputs.include_not_interested || 'false' }}
        run: npm run verify

      # Last word of the day: any placement whose published opening date has now
      # arrived is open, whether or not verification could reach the employer.
      - name: Apply published opening dates
        run: npm run openings
