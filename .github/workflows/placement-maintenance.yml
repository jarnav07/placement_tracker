name: Placement Maintenance

on:
  schedule:
    # GitHub cron is UTC only. Firing at both 15:00 and 16:00 UTC and letting the
    # job decide keeps the effective schedule at 16:00 Europe/London across the
    # BST/GMT changeover.
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      steps:
        description: Which steps to run
        type: choice
        default: discover-and-audit
        options: [discover-and-audit, audit-only, discover-only]
      limit:
        description: 'Verify at most N roles (0 = all). Least recently verified first.'
        type: string
        default: '0'
      only_stale_days:
        description: 'Only verify roles not checked in the last N days (0 = all).'
        type: string
        default: '0'
      include_not_interested:
        description: Also verify roles marked Not Interested
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: placement-maintenance
  # An interrupted audit must not leave the board half-updated.
  cancel-in-progress: false

jobs:
  gate:
    # The schedule fires twice; only the 16:00 Europe/London invocation should do
    # work. A manual run is ALWAYS honoured — the previous version applied the
    # clock gate to workflow_dispatch too, so manual runs silently did nothing
    # unless they happened to be started at exactly 4 PM UK.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run — proceeding."
            exit 0
          fi
          UK_TIME="$(TZ=Europe/London date +%H:%M)"
          if [ "$UK_TIME" = "16:00" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Proceeding at $(TZ=Europe/London date '+%Y-%m-%d %H:%M %Z')."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping non-4 PM UK trigger at $(TZ=Europe/London date '+%Y-%m-%d %H:%M %Z')."
          fi

  maintain:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
      STEPS: ${{ inputs.steps || 'discover-and-audit' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check required secrets
        run: |
          missing=""
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY AZURE_OPENAI_API_KEY AZURE_OPENAI_ENDPOINT AZURE_OPENAI_DEPLOYMENT_NAME; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi

      # Deterministic crawl of career pages already tracked. Only links whose own
      # label and URL read as a student vacancy become candidates, and each one is
      # verified before it is inserted.
      - name: Discover new 2027 placements
        if: env.STEPS != 'audit-only'
        env:
          USE_AZURE: 'true'
          USE_GROQ: 'false'
          USE_OPENAI: 'false'
        run: npm run discover

      # Azure OpenAI re-researches each tracked role and writes back the
      # researched columns. Identity, derived ranking and user-owned tracking
      # columns are never written.
      - name: Verify and enrich every tracked placement
        if: env.STEPS != 'discover-only'
        env:
          AUDIT_LIMIT: ${{ inputs.limit || '0' }}
          AUDIT_ONLY_STALE_DAYS: ${{ inputs.only_stale_days || '0' }}
          AUDIT_INCLUDE_NOT_INTERESTED: ${{ inputs.include_not_interested || 'false' }}
        run: npm run audit:azure
