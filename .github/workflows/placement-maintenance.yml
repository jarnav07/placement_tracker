name: Placement Maintenance

on:
  schedule:
    # GitHub cron is UTC and does not support IANA time zones directly.
    # Run at both 15:00 and 16:00 UTC, then allow only the invocation whose
    # Europe/London local time is exactly 16:00. This keeps the effective
    # schedule at 4:00 PM UK time across BST/GMT transitions.
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: placement-maintenance
  # Never cancel a run in progress: an interrupted audit must not leave a half-updated board.
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run only at 4:00 PM UK time
        run: |
          if [ "$(TZ=Europe/London date +%H:%M)" != "16:00" ]; then
            echo "This UTC trigger is not the 4:00 PM Europe/London invocation; skipping."
            exit 0
          fi
          echo "Proceeding at $(TZ=Europe/London date '+%Y-%m-%d %H:%M %Z') Europe/London."

      - name: Install dependencies
        run: npm ci

      - name: Discover new 2027 placements
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          USE_GROQ: 'false'
          USE_AZURE: 'true'
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
          USE_OPENAI: 'false'
        run: npm run discover

      - name: Azure-only verification of every placement
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
        run: npm run audit:azure
