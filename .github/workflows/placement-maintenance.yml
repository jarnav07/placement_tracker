name: Placement Maintenance

on:
  schedule:
    # GitHub cron is UTC and does not support IANA time zones directly.
    # Run at both 15:00 and 16:00 UTC, then allow only the invocation whose
    # Europe/London local time is exactly 16:00. This keeps the effective
    # schedule at 4:00 PM UK time across BST/GMT transitions.
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

env:
  RUN_MAINTENANCE: 'false'

permissions:
  contents: read

concurrency:
  group: placement-maintenance
  # Never cancel a run in progress: an interrupted audit must not leave a half-updated board.
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Determine 4 PM UK invocation
        run: |
          UK_TIME="$(TZ=Europe/London date +%H:%M)"
          if [ "$UK_TIME" = "16:00" ]; then
            echo "RUN_MAINTENANCE=true" >> "$GITHUB_ENV"
            echo "Proceeding at $(TZ=Europe/London date '+%Y-%m-%d %H:%M %Z') Europe/London."
          else
            echo "RUN_MAINTENANCE=false" >> "$GITHUB_ENV"
            echo "Skipping non-4 PM UK trigger at $(TZ=Europe/London date '+%Y-%m-%d %H:%M %Z') Europe/London."
          fi

      - name: Checkout
        if: env.RUN_MAINTENANCE == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: env.RUN_MAINTENANCE == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: env.RUN_MAINTENANCE == 'true'
        run: npm ci

      - name: Discover new 2027 placements
        if: env.RUN_MAINTENANCE == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          USE_GROQ: 'false'
          USE_AZURE: 'true'
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
          USE_OPENAI: 'false'
        run: npm run discover

      - name: Azure-only verification of every placement
        if: env.RUN_MAINTENANCE == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT_NAME: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
        run: npm run audit:azure
